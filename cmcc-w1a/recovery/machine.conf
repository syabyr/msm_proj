# W1A machine/partition map for the recovery init and menu.
sdcard_partition=mmcblk0p33      # Alpine rootfs (userdata)
firmware_partition=mmcblk0p1     # modem/WCNSS firmware (vfat)
boot_partition=mmcblk0p20        # lk2nd @0, normal boot.img @512K
recovery_partition=mmcblk0p24    # this image (Volume Up recovery)
persist_partition=mmcblk0p22     # WCNSS NV
cache_partition=mmcblk0p23       # ext2 (unused extlinux)
system_partition=mmcblk0p21      # stock Android (keep)
